name: Anbu Health AI — Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          pip install fastapi pydantic python-dotenv
          find backend -name "*.py" | xargs python -m py_compile && echo "✅ All Python files compile"

      - name: Run smoke tests
        run: |
          pip install pytest httpx slowapi python-multipart uvicorn fastapi pydantic python-dotenv
          cd backend && python -m pytest tests/ -v

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Capture the currently-active revision BEFORE deploying ──────────────
      # This is what we roll back to if the new revision fails its health
      # check below. Without this, a bad deploy just sits there broken until
      # someone notices and manually finds an older working image tag.
      - name: Record previous revision (for rollback)
        id: previous
        run: |
          PREV_REVISION=$(az containerapp revision list \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active].name | [0]" \
            --output tsv)
          echo "revision=$PREV_REVISION" >> "$GITHUB_OUTPUT"
          echo "Previous active revision: $PREV_REVISION"

      # Deploy image using az CLI — NEVER wipes env vars.
      # Uses the immutable sha-<commit> tag (not floating :latest) so we
      # always know exactly which image is running and can target a
      # rollback precisely.
      - name: Update container image
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            --set-env-vars \
              "GROQ_API_KEY=secretref:groq-key" \
              "VISION_GITHUB_TOKEN=secretref:vision-github-token" \
              "WANDB_API_KEY=secretref:wandb-key" \
              "QDRANT_URL=secretref:qdrant-url" \
              "QDRANT_API_KEY=secretref:qdrant-key" \
              "SUPABASE_URL=secretref:supabase-url" \
              "SUPABASE_SERVICE_KEY=secretref:supabase-key" \
              "MSG91_AUTH_KEY=secretref:msg91-authkey" \
              "MSG91_TEMPLATE_ID=secretref:msg91-template-id" \
              "GROQ_MODEL=llama-3.3-70b-versatile" \
              "GROQ_MODEL_FALLBACK=llama-3.1-8b-instant" \
              "GROQ_MODEL_FALLBACK2=llama-3.1-70b-versatile" \
              "WANDB_PROJECT=anbu-health-ai" \
              "WANDB_ENTITY=rajaganaa-ai" \
              "WANDB_MODE=online" \
              "MSG91_SENDER_ID=ANBUHC" \
              "MAX_PROMPTS_PER_DAY=20" \
              "PORT=8000" \
              "FIREBASE_SERVICE_ACCOUNT_JSON=secretref:firebase-service-account-json" \
              "FIREBASE_PROJECT_ID=secretref:react-app-firebase-project-id" \
              "REDIS_URL=secretref:redis-url" \
              "SARVAM_API_KEY=secretref:sarvam-api-key"

      - name: Open ingress
        run: |
          az containerapp ingress access-restriction remove \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --rule-name deny-all 2>/dev/null || true

      # ── Post-deploy health check ─────────────────────────────────────────────
      # Give the new revision time to actually warm up (pipeline load —
      # see /ready in main.py) before judging it. Polls /health for up to
      # ~2 minutes; Container Apps' own readiness probe is also gating
      # traffic in parallel, so this is a second, independent confirmation
      # from outside the cluster.
      - name: Health check new revision
        id: healthcheck
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" --output tsv)

          echo "Checking https://$APP_URL/health ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$APP_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 2 minutes"
          exit 1

      # ── Automatic rollback on failed health check ───────────────────────────
      - name: Rollback to previous revision on failure
        if: failure() && steps.previous.outputs.revision != ''
        run: |
          echo "⚠️ Deploy failed health check — rolling back to ${{ steps.previous.outputs.revision }}"
          az containerapp revision activate \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision ${{ steps.previous.outputs.revision }}
          az containerapp ingress traffic set \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight ${{ steps.previous.outputs.revision }}=100
          echo "Rolled back. Previous revision is now serving 100% of traffic."
          exit 1
