# Anbu Health AI — Monitoring stack (Prometheus + Grafana)
#
# Run locally or on any free VM (e.g. an Azure/GCP/AWS student-credit VM):
#   cd monitoring
#   docker compose up -d
#
# Prometheus scrapes the live /metrics endpoint of the deployed API
# (Azure Container Apps — scale-to-zero is fine, Prometheus just records
# gaps when the app is asleep). Grafana auto-loads a pre-built dashboard.
#
#   Prometheus → http://localhost:9090
#   Grafana    → http://localhost:3001  (admin / admin — change on first login)

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: anbu-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: anbu-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
