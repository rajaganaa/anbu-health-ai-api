version: "3.8"

services:
  prometheus-config:
    image: alpine:3.20
    container_name: anbu-prometheus-config
    env_file:
      - .env
    volumes:
      - ./prometheus.template.yml:/template/prometheus.template.yml:ro
      - prom_config:/out
    command: >
      sh -c "apk add --no-cache gettext > /dev/null &&
             envsubst < /template/prometheus.template.yml > /out/prometheus.yml"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: anbu-prometheus
    depends_on:
      - prometheus-config
    volumes:
      - prom_config:/etc/prometheus
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: anbu-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom_data:
  prom_config:
  grafana_data: